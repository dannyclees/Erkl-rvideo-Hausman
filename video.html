<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hausman Erklärvideo</title>
<style>
  html, body { margin: 0; padding: 0; background: #111; }
  #stage { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #F7E7A6; }
  svg { display: block; }
  text { font-family: "Inter Display", "Inter", sans-serif; }
  #controls { font: 14px sans-serif; color: #ddd; padding: 8px; }
  body.render #controls { display: none; }
</style>
</head>
<body>
<div id="stage">
<svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <rect id="bg" width="1920" height="1080" fill="#F7E7A6"/>
  <g id="scenes"></g>
</svg>
</div>
<div id="controls">
  <button id="play">▶ Abspielen</button>
  <input id="scrub" type="range" min="0" max="30" step="0.01" value="0" style="width:600px">
  <span id="tlabel">0.00s</span>
</div>
<script src="characters.js"></script>
<script>
const { C, el, g, P, circle, rrect, technician, customer, handGrip, sparkle, dust, grid, squiggle, tablet } = Art;
const DURATION = 30;
const BG_GREY = "#ECEAE3", BG_PALE = "#F7E7A6", BG_GOLD = "#E8C85E", BG_DARK = "#1d1d1b", BG_CREAM = "#FFF6DC";
const scenesRoot = document.getElementById("scenes");
const bgRect = document.getElementById("bg");

// ---------------------------------------------------------------- easing
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeIn = p => p * p * p;
const back = p => { p = clamp(p); const s = 1.6; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };

// ---------------------------------------------------------------- scene system
const scenes = [];
let sceneIdx = 0;
function scene(name, t0, t1, bg, build) {
  const root = g(scenesRoot);
  // each scene carries its own background and is revealed by a growing circle (no cross-fades / ghosting)
  const cp = el("clipPath", { id: "wipe" + sceneIdx }, root);
  const wipe = el("circle", { cx: 1700, cy: 120, r: 0 }, cp);
  const content = g(root, { "clip-path": `url(#wipe${sceneIdx++})` });
  el("rect", { width: 1920, height: 1080, fill: bg }, content);
  const s = { name, t0, t1, bg, root, wipe, anims: [] };
  build(g(content), s);
  scenes.push(s);
}
const on = (s, fn) => s.anims.push(fn);
// node transform helper: position + scale + rotate around an anchor, plus optional float
function animNode(s, node, { x = 0, y = 0, t0 = 0, dur = 0.6, from = "pop", float = 0, period = 3, phase = 0, rot = 0 }) {
  on(s, t => {
    const p = clamp((t - t0) / dur);
    let k = 1, dx = 0, dy = 0, op = p > 0 ? 1 : 0;
    if (from === "pop") k = p <= 0 ? 0 : back(p);
    if (from === "up") { dy = (1 - easeOut(p)) * 700; }
    if (from === "left") { dx = -(1 - easeOut(p)) * 900; }
    if (from === "right") { dx = (1 - easeOut(p)) * 900; }
    if (from === "fade") op = easeOut(p);
    const fl = float ? float * Math.sin((t + phase) * Math.PI * 2 / period) : 0;
    const r = rot ? rot * Math.sin((t + phase) * Math.PI * 2 / period) : 0;
    node.setAttribute("transform", `translate(${x + dx},${y + dy + fl}) rotate(${r}) scale(${k})`);
    node.setAttribute("opacity", op);
  });
}
// subtle life for characters: head tilt + breathing
function alive(s, ch, phase = 0) {
  on(s, t => {
    const k = Math.sin((t + phase) * Math.PI * 2 / 2.8);
    ch.head.setAttribute("transform", `translate(0,${24 + 2 * k}) rotate(${1.6 * k} 0 -100)`);
  });
}
function swingArm(s, arm, cx, cy, amp, period, t0 = 0) {
  on(s, t => arm.setAttribute("transform", t < t0 ? "" : `rotate(${amp * Math.sin((t - t0) * Math.PI * 2 / period)} ${cx} ${cy})`));
}

// ---------------------------------------------------------------- reference-style decoration kit
function sparkles(s, parent, list, color = C.ink, t0 = 0.3) {
  list.forEach(([x, y, r], i) => {
    const n = g(parent); sparkle(n, 0, 0, r, color);
    on(s, t => {
      const p = clamp((t - t0 - i * 0.12) / 0.5);
      const tw = 0.85 + 0.2 * Math.sin((t + i) * 3.1);
      n.setAttribute("transform", `translate(${x},${y}) scale(${(p <= 0 ? 0 : back(p)) * tw})`);
    });
  });
}
// thin line that draws itself on
function drawLine(s, parent, d, t0, dur = 0.8, stroke = C.ink, w = 2.6) {
  const p = P(parent, d, "none", { stroke, w });
  const len = p.getTotalLength();
  p.style.strokeDasharray = `${len} ${len}`;
  on(s, t => { p.style.strokeDashoffset = len * (1 - easeInOut(clamp((t - t0) / dur))); });
  return p;
}
function gridIn(s, parent, x, y, w, h, t0, color = C.ink) {
  const grp = grid(parent, x, y, w, h, 34, color);
  const clipId = "gc" + Math.random().toString(36).slice(2);
  const cp = el("clipPath", { id: clipId }, parent);
  const r = el("rect", { x, y: y - 4, width: 0, height: h + 8 }, cp);
  grp.setAttribute("clip-path", `url(#${clipId})`);
  on(s, t => r.setAttribute("width", (w + 8) * easeInOut(clamp((t - t0) / 0.9))));
  return grp;
}
function dustIn(s, parent, cx, cy, rx, ry, n, seed, t0, color = C.ink) {
  const d = dust(parent, cx, cy, rx, ry, n, seed, color);
  on(s, t => d.setAttribute("opacity", easeOut(clamp((t - t0) / 0.6))));
  return d;
}
// speech bubble (white, thin outline, tail bottom-left) with stipple shadow, content callback
function bubble(parent, w, h, content, tail = "left") {
  const b = g(parent);
  dust(b, w * 0.12, h * 0.62, w * 0.55, h * 0.18, 220, 11);
  const r = 34;
  const tl = tail === "left";
  const d = `M${-w / 2 + r},${-h / 2} H${w / 2 - r} Q${w / 2},${-h / 2} ${w / 2},${-h / 2 + r} V${h / 2 - r} Q${w / 2},${h / 2} ${w / 2 - r},${h / 2} ` +
    (tl ? `H${-w / 2 + 90} L${-w / 2 + 10},${h / 2 + 80} L${-w / 2 + 40},${h / 2} ` : `H${w / 2 - 40} L${w / 2 - 10},${h / 2 + 80} L${w / 2 - 90},${h / 2} `) +
    `H${-w / 2 + r} Q${-w / 2},${h / 2} ${-w / 2},${h / 2 - r} V${-h / 2 + r} Q${-w / 2},${-h / 2} ${-w / 2 + r},${-h / 2} Z`;
  P(b, d, C.white, { w: 3.5 });
  content(b);
  return b;
}
function label(parent, str, x, y, size = 46, fill = C.ink) {
  const t = el("text", { x, y, "font-size": size, "font-weight": 800, fill, "text-anchor": "middle", "dominant-baseline": "middle", "letter-spacing": 0.5 }, parent);
  t.textContent = str;
  return t;
}

// ---------------------------------------------------------------- icon set (white/black/gold, thin outline)
const icon = {
  tap(p) {
    P(p, "M-90,-30 H30 C62,-30 78,-14 78,18 V40 M-90,-56 V-4 M-40,-30 V-60 M-70,-62 H-10", "none", { w: 9 });
    P(p, "M78,72 C66,92 66,104 78,112 C90,104 90,92 78,72 Z", C.gold, { w: 3.5 });
  },
  radiator(p) {
    rrect(p, -110, -60, 220, 120, 14, C.white, { w: 4 });
    for (let i = 1; i < 6; i++) P(p, `M${-110 + i * 36.6},-44 V44`, "none", { w: 4 });
    P(p, "M-85,60 v18 M85,60 v18", "none", { w: 5 });
  },
  flame(p) {
    P(p, "M0,-80 C30,-40 70,-10 60,30 C52,64 26,80 0,80 C-26,80 -52,64 -60,30 C-68,0 -40,-20 -30,-50 C-20,-30 -10,-20 0,-15 C10,-40 4,-60 0,-80 Z", C.gold, { w: 4 });
    P(p, "M0,20 C14,34 20,48 14,60 C8,72 -8,72 -14,60 C-20,48 -12,34 0,20 Z", C.white, { w: 3.5 });
  },
  snow(p) {
    for (let a = 0; a < 180; a += 60) {
      const r = a * Math.PI / 180, c = Math.cos(r) * 70, s = Math.sin(r) * 70;
      P(p, `M${-c},${-s} L${c},${s}`, "none", { w: 8 });
    }
    for (let a = 0; a < 360; a += 60) {
      const r = a * Math.PI / 180, mx = Math.cos(r) * 44, my = Math.sin(r) * 44;
      const l = 18;
      P(p, `M${mx + Math.cos(r + 0.8) * l},${my + Math.sin(r + 0.8) * l} L${mx},${my} L${mx + Math.cos(r - 0.8) * l},${my + Math.sin(r - 0.8) * l}`, "none", { w: 6 });
    }
    circle(p, 0, 0, 12, C.gold, { w: 3.5 });
  },
  shower(p) {
    P(p, "M-70,90 V-50 C-70,-75 -55,-85 -30,-85 H20 C40,-85 50,-75 50,-55 V-45", "none", { w: 8 });
    P(p, "M0,-35 C20,-60 80,-60 100,-35 Z", C.ink, { w: 4 });
    [[20, -10], [50, 0], [80, -10], [35, 25], [65, 30]].forEach(([x, y]) => P(p, `M${x},${y} l-5,16`, "none", { w: 6, stroke: C.goldDeep }));
  },
  roller(p) {
    rrect(p, -80, -70, 140, 50, 14, C.gold, { w: 4 });
    P(p, "M60,-45 H85 V10 L0,30 V60", "none", { w: 7 });
    rrect(p, -14, 60, 28, 70, 10, C.ink, { w: 3 });
  },
  house(p) {
    P(p, "M-90,0 L0,-80 L90,0 V80 H-90 Z", C.white, { w: 5 });
    rrect(p, -24, 20, 48, 60, 4, C.gold, { w: 4 });
    P(p, "M40,-45 V-75 H62 V-26", "none", { w: 5 });
  },
};

// ================================================================ 1 · Misconception (0 – 4.6)
scene("question", 0, 4.6, BG_PALE, (r, s) => {
  gridIn(s, r, 1150, 380, 340, 300, 0.2);
  drawLine(s, r, "M260,330 C380,300 520,330 580,420", 0.4);
  drawLine(s, r, "M1380,860 C1500,820 1610,860 1640,930 C1660,980 1600,1000 1590,960 C1580,920 1650,880 1720,900", 0.8);
  sparkles(s, r, [[330, 560, 44], [700, 170, 38], [1540, 300, 28], [1700, 640, 34], [440, 890, 24]], C.ink, 0.3);
  // customer, cropped at the bottom like in the reference
  const cG = g(r); const cust = customer(cG, { pose: "think" });
  animNode(s, cG, { x: 860, y: 770, t0: 0.05, dur: 0.8, from: "up" });
  alive(s, cust);
  // two thought bubbles: heating? sanitary?
  const b1 = bubble(r, 330, 230, b => { const i = g(b, { transform: "scale(0.95)" }); icon.radiator(i); }, "right");
  animNode(s, b1, { x: 420, y: 250, t0: 0.9, dur: 0.6, float: 8, period: 3.2 });
  const b2 = bubble(r, 330, 230, b => { const i = g(b, { transform: "translate(-6,-10) scale(1)" }); icon.tap(i); });
  animNode(s, b2, { x: 1350, y: 230, t0: 1.5, dur: 0.6, float: 8, period: 3.2, phase: 1.2 });
  // "?!" badge
  const q = g(r);
  circle(q, 0, 0, 78, C.ink, { w: 0 });
  label(q, "?!", 0, 4, 92, C.gold);
  animNode(s, q, { x: 1130, y: 430, t0: 2.3, dur: 0.55, rot: 8, period: 0.9 });
});

// ================================================================ 2 · Meet Hausman (4.6 – 8.6)
scene("meet", 4.6, 8.6, BG_GOLD, (r, s) => {
  gridIn(s, r, 1180, 360, 360, 330, 0.2);
  drawLine(s, r, "M300,420 C420,380 560,410 620,500", 0.3);
  drawLine(s, r, "M260,820 C380,860 470,920 450,980 C430,1030 380,990 410,950 C450,900 560,920 640,980", 0.6);
  sparkles(s, r, [[520, 230, 50], [380, 640, 36], [1500, 760, 32], [1680, 260, 26]], C.ink, 0.4);
  // big speech bubble with the original Hausman logo
  const b = bubble(r, 470, 330, bb => {
    el("image", { href: "assets/logo.png", x: -150, y: -142, width: 300, height: 230 }, bb);
  });
  animNode(s, b, { x: 1400, y: 270, t0: 1.0, dur: 0.6, float: 7, period: 3.4 });
  const tG = g(r); const tech = technician(tG, { pose: "wave" });
  animNode(s, tG, { x: 860, y: 770, t0: 0.05, dur: 0.8, from: "up" });
  alive(s, tech);
  swingArm(s, tech.armR, 120, 30, 7, 0.8, 0.9);
});

// ================================================================ service scene template
// Tech bust left/centre, a hero prop on the right with grid + dust, speech bubble with icon + word.
function service(name, t0, t1, bg, word, iconFn, pose, hero, opt = {}) {
  scene(name, t0, t1, bg, (r, s) => {
    const ink = opt.dark ? C.gold : C.ink;
    gridIn(s, r, 1230, 420, 380, 340, 0.15, ink);
    dustIn(s, r, 1320, 860, 300, 90, 360, 3, 0.4, ink);
    drawLine(s, r, "M220,300 C340,260 480,290 540,380", 0.3, 0.8, ink);
    drawLine(s, r, "M180,820 C300,780 400,800 420,880 C430,930 370,940 370,900 C370,850 470,840 560,880", 0.6, 0.9, ink);
    sparkles(s, r, opt.sparks || [[420, 200, 46], [300, 610, 34], [1760, 820, 30], [1120, 140, 26]], ink, 0.35);
    const heroG = g(r);
    hero(heroG, s);
    const tG = g(r); const tech = technician(tG, { pose });
    animNode(s, tG, { x: opt.techX || 760, y: 770, t0: 0.0, dur: 0.75, from: "up" });
    alive(s, tech, 0.4);
    if (opt.prop) opt.prop(tech, s);
    const bw = word.length > 9 ? 500 : 440;
    const b = bubble(r, bw, 210, bb => {
      const i = g(bb, { transform: `translate(${-bw / 2 + 100},0) scale(0.75)` }); iconFn(i);
      label(bb, word, 70 + (bw - 440) / 2, 4, word.length > 9 ? 42 : 50);
    }, opt.bubbleTail || "left");
    animNode(s, b, { x: opt.bubbleX || 1420, y: opt.bubbleY || 200, t0: 0.55, dur: 0.6, float: 7, period: 3.3 });
  });
}

// ================================================================ 3 · Badezimmer (8.6 – 12.6)
service("bad", 8.6, 12.6, BG_PALE, "Badezimmer", icon.shower, "tool", (r, s) => {
  // stacked tiles (like the coin stack in the reference) + rain shower
  const stack = g(r);
  for (let i = 0; i < 6; i++) {
    const row = g(stack);
    rrect(row, -150, -60 * i - 50, 300, 50, 10, i % 2 ? C.white : C.ink, { w: 4 });
    P(row, `M-50,${-60 * i - 50} V${-60 * i} M50,${-60 * i - 50} V${-60 * i}`, "none", { w: 3.5, stroke: i % 2 ? C.ink : C.gold });
    animNode(s, row, { x: 0, y: 0, t0: 0.3 + i * 0.09, dur: 0.45, from: "pop" });
  }
  animNode(s, stack, { x: 1430, y: 900, t0: 0.25, dur: 0.01 });
  const sh = g(r);
  P(sh, "M0,0 V-280 C0,-320 20,-340 60,-340 H170 C200,-340 215,-325 215,-295 V-270", "none", { w: 12 });
  P(sh, "M140,-262 C175,-310 255,-310 290,-262 Z", C.ink, { w: 4 });
  const drops = [];
  for (let i = 0; i < 7; i++) drops.push(P(sh, `M${165 + i * 18},-240 l-4,22`, "none", { w: 6, stroke: C.goldDeep }));
  on(s, t => drops.forEach((d, i) => { const c = (t * 1.3 + i * 0.17) % 1; d.setAttribute("transform", `translate(${-c * 12},${c * 170})`); d.setAttribute("opacity", t > 1.0 ? 1 - c : 0); }));
  sh.setAttribute("transform", "scale(-1,1)"); const shW = g(r); shW.appendChild(sh);
  animNode(s, shW, { x: 1790, y: 560, t0: 0.6, dur: 0.6 });
}, { prop: (tech, s) => {
  // wrench in the gripping hand
  const w = g(tech.handR, { transform: "translate(4,-70)" });
  P(w, "M-9,0 H9 V-120 H-9 Z", C.white, { w: 4 });
  P(w, "M-26,-128 C-30,-160 -10,-178 0,-178 L0,-150 L14,-150 L14,-178 C30,-170 34,-140 24,-122 Z", C.white, { w: 4 });
  swingArm(s, tech.armR, 120, 30, 5, 1.1, 0.8);
}, techX: 700, bubbleX: 1150, bubbleY: 170 });

// ================================================================ 4 · Heizung (12.6 – 16.6)
service("heizung", 12.6, 16.6, BG_GOLD, "Heizung", icon.flame, "tablet", (r, s) => {
  // radiator with heat waves
  const rad = g(r);
  rrect(rad, -220, -170, 440, 300, 22, C.white, { w: 4.5 });
  for (let i = 1; i < 8; i++) P(rad, `M${-220 + i * 55},-145 V105`, "none", { w: 4.5 });
  P(rad, "M-170,130 v40 M170,130 v40 M-220,-120 h-50 v-50", "none", { w: 7 });
  circle(rad, -270, -190, 26, C.ink, { w: 0 });
  animNode(s, rad, { x: 1420, y: 720, t0: 0.3, dur: 0.6 });
  const waves = [];
  for (let i = 0; i < 4; i++) {
    const x = 1300 + i * 80;
    waves.push(P(r, `M${x},520 C${x + 22},490 ${x - 22},460 ${x},430 C${x + 22},400 ${x - 22},370 ${x},340`, "none", { w: 6 }));
  }
  on(s, t => waves.forEach((w, i) => { const c = (t * 0.55 + i * 0.25) % 1; w.setAttribute("transform", `translate(0,${-50 * c})`); w.setAttribute("opacity", t > 0.9 ? Math.sin(Math.PI * c) : 0); }));
}, { prop: (tech, s) => {
  // smart thermostat / tablet in hand, temperature counting up (like the calculator in the reference)
  const tb = g(tech.root, { transform: "translate(70,120) rotate(-6)" });
  rrect(tb, -95, -135, 190, 270, 18, C.white, { w: 4.5 });
  rrect(tb, -72, -110, 144, 90, 8, C.ink, { w: 0 });
  const tt = label(tb, "18°", 0, -63, 58, C.gold);
  for (let rI = 0; rI < 3; rI++) for (let cI = 0; cI < 3; cI++) rrect(tb, -70 + cI * 52, 10 + rI * 38, 36, 24, 6, C.ink, { w: 0 });
  on(s, t => { tt.textContent = Math.round(lerp(18, 22, easeInOut(clamp((t - 0.8) / 1.6)))) + "°"; });
  // re-attach the open hand in front of the tablet
  const h = g(tech.root, { transform: "translate(110,240) rotate(-150)" });
  Art.handOpen(h);
}, techX: 720, bubbleX: 1380 });

// ================================================================ 5 · Klima (16.6 – 20.6)
service("klima", 16.6, 20.6, BG_GREY, "Klima", icon.snow, "point", (r, s) => {
  // indoor split unit
  const ac = g(r);
  rrect(ac, -260, -75, 520, 150, 34, C.white, { w: 4.5 });
  P(ac, "M-220,30 H220 M-200,52 H200", "none", { w: 5 });
  rrect(ac, 150, -45, 80, 26, 8, C.gold, { w: 3.5 });
  animNode(s, ac, { x: 1420, y: 470, t0: 0.3, dur: 0.6 });
  const air = [];
  for (let i = 0; i < 3; i++) {
    const y = 580 + i * 70;
    air.push(P(r, `M1220,${y} C1320,${y + 40} 1460,${y - 40} 1640,${y + 20}`, "none", { w: 6, stroke: C.ink }));
  }
  on(s, t => air.forEach((a, i) => { const c = (t * 0.6 + i * 0.33) % 1; a.setAttribute("transform", `translate(${-40 * c},${70 * c})`); a.setAttribute("opacity", t > 0.9 ? Math.sin(Math.PI * c) : 0); }));
  [[1260, 860, 0.45], [1500, 820, 0.35], [1700, 900, 0.4]].forEach(([x, y, k], i) => {
    const f = g(r); const inner = g(f, { transform: `scale(${k})` });
    const sn = g(inner); icon.snow(sn);
    sn.querySelectorAll("path").forEach(p => p.setAttribute("stroke", C.gold));
    on(s, t => { const p = clamp((t - 1.0 - i * 0.2) / 0.5); f.setAttribute("transform", `translate(${x},${y + 8 * Math.sin(t * 2 + i)}) rotate(${t * 30 * (i % 2 ? 1 : -1)}) scale(${p <= 0 ? 0 : back(p)})`); });
  });
}, { techX: 700, bubbleX: 1380, bubbleY: 210, sparks: [[420, 200, 46], [300, 610, 34], [1800, 640, 26], [1120, 140, 26]] });

// ================================================================ 6 · Innenausbau (20.6 – 24.6)
service("innen", 20.6, 24.6, BG_CREAM, "Innenausbau", icon.roller, "tool", (r, s) => {
  // wall being painted in stripes + stacked floor planks
  const wall = g(r);
  rrect(wall, -260, -240, 520, 400, 10, C.white, { w: 4.5 });
  for (let i = 0; i < 4; i++) {
    const stripe = rrect(wall, -250 + i * 125, -230, 125, 0, 0, C.gold, { w: 0 });
    on(s, t => stripe.setAttribute("height", 380 * easeInOut(clamp((t - 0.6 - i * 0.35) / 0.5))));
  }
  P(wall, "M-260,-240 H260 V160 H-260 Z", "none", { w: 4.5 });
  animNode(s, wall, { x: 1430, y: 590, t0: 0.25, dur: 0.6 });
  const planks = g(r);
  for (let i = 0; i < 4; i++) {
    const pl = g(planks);
    rrect(pl, -200, -36 * i - 32, 400, 32, 8, i % 2 ? C.ink : "#C98B54", { w: 4 });
    P(pl, `M-60,${-36 * i - 32} V${-36 * i} M90,${-36 * i - 32} V${-36 * i}`, "none", { w: 3, stroke: i % 2 ? C.gold : C.ink });
    animNode(s, pl, { x: 0, y: 0, t0: 1.6 + i * 0.12, dur: 0.4, from: "right" });
  }
  animNode(s, planks, { x: 1430, y: 905, t0: 0, dur: 0.01 });
}, { prop: (tech, s) => {
  const ro = g(tech.handR, { transform: "translate(0,-60)" });
  P(ro, "M-12,0 H12 V-90 H-12 Z", C.ink, { w: 3 });
  P(ro, "M0,-90 V-150 H90 V-175", "none", { w: 7 });

// ---------------------------------------------------------------- renderer
const TRANS = 0.55;
function render(t) {
  scenes.forEach((s, i) => {
    const next = scenes[i + 1];
    // visible from its own start until the next scene's wipe has fully covered it
    const active = t >= s.t0 - 1e-3 && (!next || t < next.t0 + TRANS);
    s.root.setAttribute("display", active ? "inline" : "none");
    if (!active) return;
    const p = i === 0 ? 1 : easeInOut(clamp((t - s.t0) / TRANS));
    s.wipe.setAttribute("r", p >= 1 ? 2400 : 2300 * p);
    for (const fn of s.anims) fn(t - s.t0);
  });
}
window.setTime = render;
window.ready = document.fonts.load('800 60px "Inter Display"').then(() => { render(0); return true; });

let playing = false, startWall = 0, startT = 0;
const scrub = document.getElementById("scrub"), lbl = document.getElementById("tlabel");
scrub.oninput = () => { playing = false; render(+scrub.value); lbl.textContent = (+scrub.value).toFixed(2) + "s"; };
document.getElementById("play").onclick = () => {
  playing = true; startWall = performance.now(); startT = +scrub.value >= DURATION ? 0 : +scrub.value;
  requestAnimationFrame(function loop(now) {
    if (!playing) return;
    const t = startT + (now - startWall) / 1000;
    render(Math.min(t, DURATION)); scrub.value = t; lbl.textContent = t.toFixed(2) + "s";
    if (t < DURATION) requestAnimationFrame(loop); else playing = false;
  });
};
if (location.search.includes("render")) document.body.classList.add("render");
